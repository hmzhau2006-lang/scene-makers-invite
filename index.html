<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دعوة المشهد الأخير</title>
<meta name="description" content="اكتب اسمك واستلم دعوتك لحضور الحفل الختامي لمعسكر صنّاع المشهد">
<meta property="og:title" content="دعوة | المشهد الأخير">
<meta property="og:description" content="الحفل الختامي لمعسكر صنّاع المشهد · الخميس ١٩ نوفمبر ٢٠٢٦">
<meta property="og:image" content="invite-bg.jpg">
<meta name="theme-color" content="#03292b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#021a1b;--ink:#f2efe6;--muted:#9fc3c1;--gold:#e2c48a;--line:rgba(226,196,138,.45)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse 90% 70% at 50% 30%,#0b5457 0%,#05393b 45%,var(--bg) 100%);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
main{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center}
.side h1{font-size:clamp(30px,5vw,46px);font-weight:800;margin:0 0 6px;color:var(--gold);line-height:1.2}
.side p{margin:0 0 26px;color:var(--muted);font-size:17px;line-height:1.7}
label{display:block;font-size:15px;color:var(--muted);margin-bottom:8px}
input{width:100%;font:inherit;font-size:22px;font-weight:800;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:10px 2px;outline:none;transition:border-color .2s}
input:focus{border-bottom-color:var(--gold)}
input::placeholder{color:rgba(242,239,230,.3);font-weight:500}
.actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
button{font:inherit;font-size:17px;font-weight:800;border:1px solid var(--gold);padding:13px 26px;cursor:pointer;transition:background .2s,color .2s}
.primary{background:var(--gold);color:#03292b}
.primary:hover{background:#f0d9a6}
.ghost{background:transparent;color:var(--gold)}
.ghost:hover{background:rgba(226,196,138,.1)}
button:disabled{opacity:.4;cursor:not-allowed}
.hint{margin-top:14px;font-size:14px;color:var(--muted);min-height:20px}
.card{position:relative;width:100%;aspect-ratio:1080/1350;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
canvas{width:100%;height:100%;display:block}
footer{margin-top:36px;font-size:13px;color:rgba(159,195,193,.6);text-align:center}
@media (max-width:760px){main{grid-template-columns:1fr;gap:26px}.preview{order:-1}.side{text-align:center}.actions{justify-content:center}}
</style>
</head>
<body>
<main>
  <section class="side">
    <h1>دعوتك جاهزة</h1>
    <p>اكتب اسمك، وتطلع لك الدعوة باسمك. حمّلها أو شاركها.</p>
    <label for="name">الاسم كما تحب يظهر في الدعوة</label>
    <input id="name" maxlength="40" autocomplete="name" placeholder="مثال: محمد عبدالله">
    <div class="actions">
      <button class="primary" id="dl" disabled>حمّل الدعوة</button>
      <button class="ghost" id="share" disabled hidden>شارك</button>
    </div>
    <div class="hint" id="hint"></div>
  </section>
  <section class="preview">
    <div class="card"><canvas id="cv" width="1080" height="1350" aria-label="معاينة الدعوة"></canvas></div>
  </section>
</main>
<footer>نادي المسرح والفنون الأدائية · جامعة أم القرى</footer>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const input=document.getElementById('name'),dl=document.getElementById('dl'),shareBtn=document.getElementById('share'),hint=document.getElementById('hint');
const bg=new Image();bg.src='invite-bg.jpg';
const FONT='Tajawal';
let ready=false;

function draw(){
  if(!ready) return;
  ctx.clearRect(0,0,1080,1350);
  ctx.drawImage(bg,0,0,1080,1350);
  const name=input.value.trim().replace(/\s+/g,' ');
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
  if(!name){
    ctx.fillStyle='rgba(242,239,230,.28)';
    ctx.font=`500 44px ${FONT}`;
    ctx.fillText('اسمك هنا',540,650);
    ctx.strokeStyle='rgba(226,196,138,.35)';ctx.setLineDash([10,10]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(330,700);ctx.lineTo(750,700);ctx.stroke();ctx.setLineDash([]);
    return;
  }
  let fs=104;
  do{ctx.font=`800 ${fs}px ${FONT}`;if(ctx.measureText(name).width<=900)break;fs-=2}while(fs>44);
  ctx.fillStyle='#ffffff';
  ctx.fillText(name,540,652);
}
function update(){
  draw();
  const has=input.value.trim().length>0;
  dl.disabled=!has;shareBtn.disabled=!has;
}
function fileName(){return 'دعوة-المشهد-الأخير-'+input.value.trim().replace(/\s+/g,'-')+'.png'}
function toBlob(){return new Promise(r=>cv.toBlob(r,'image/png'))}

dl.onclick=async()=>{
  const blob=await toBlob();const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  hint.textContent='تم التحميل. إذا ما نزلت على الجوال، اضغط مطولاً على الصورة واحفظها.';
};
shareBtn.onclick=async()=>{
  try{
    const file=new File([await toBlob()],fileName(),{type:'image/png'});
    await navigator.share({files:[file],title:'دعوة المشهد الأخير'});
  }catch(e){if(e.name!=='AbortError')hint.textContent='ما قدرنا نشارك، جرّب زر التحميل.'}
};
input.addEventListener('input',update);

const q=new URLSearchParams(location.search).get('name');if(q)input.value=q;
Promise.all([new Promise(r=>{bg.complete?r():bg.onload=r}),document.fonts.load(`800 100px ${FONT}`,'اسم'),document.fonts.load(`500 40px ${FONT}`,'اسم')])
 .then(()=>{ready=true;update();
   try{const t=new File([new Blob()],'t.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[t]}))shareBtn.hidden=false}catch(e){}
 });
// tap preview on mobile to save
cv.addEventListener('contextmenu',()=>{});
</script>
</body>
</html>
